name: Publish version
on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build:
    if: "startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      # demo-server 的测试跑 bun test（apps 工具链）——release gate 的 pnpm test
      # 经 lerna 达达它，与 validate.yaml 同款需要显式装 Bun
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build
        run: pnpm run build

      # Release gate (0.12.0 shipped 15 red tests because this pipeline never
      # ran them — validate.yaml only covers main/PRs, not release branches).
      # lerna run test reaches every package with a test script (incl. zen-udf).
      - name: Test (release gate)
        run: pnpm test

      # lerna/npm publish leaves pnpm `catalog:` specifiers unrewritten in the
      # published manifest (0.3.2/0.1.0 shipped with unresolvable deps).
      # pnpm publish replaces them with the real versions from
      # pnpm-workspace.yaml. The guard replicates lerna's from-package
      # semantics: skip versions already present in the registry.
      - name: Publish unpublished packages
        id: publish
        shell: bash
        run: |
          published=""
          for pkg in packages/*; do
            name=$(node -p "require('./$pkg/package.json').name")
            ver=$(node -p "require('./$pkg/package.json').version")
            if npm view "$name@$ver" version > /dev/null 2>&1; then
              echo "[publish] $name@$ver already in registry — skip"
            else
              pnpm --filter "$name" publish --access public --no-git-checks
              published="$published $name@$ver"
            fi
          done
          echo "published=$published" >> "$GITHUB_OUTPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Propagation has two distinct lag sources, both observed:
      #  1. npm CLI per-job metadata cache (0.13.1/0.14.0) — fixed by a
      #     dedicated fresh cache dir + prefer-online;
      #  2. the runner-facing registry edge serving stale packuments for
      #     minutes AFTER the version is publicly visible elsewhere
      #     (0.14.1: npm-accepted, tarball 200 and packument present from
      #     outside while the runner polled 404 for the full window).
      # Poll BOTH channels — npm CLI and a raw registry-API fetch — either
      # confirming visibility passes. The publish acceptance line (+ pkg@ver)
      # remains the authoritative proof of write; this step only guards
      # downstream smoke steps against racing the CDN.
      - name: Wait for registry propagation
        if: steps.publish.outputs.published != ''
        shell: bash
        run: |
          fail=0
          cache="$(mktemp -d)"
          for entry in ${{ steps.publish.outputs.published }}; do
            name="${entry%@*}"
            ver="${entry#*@}"
            ok=0
            for i in $(seq 1 60); do
              enc=$(node -p "encodeURIComponent('$name').replace('%40','@').replace('/','%2f')")
              if npm view "$name@$ver" version --prefer-online --cache "$cache" > /dev/null 2>&1 ||
                 curl -fsS --max-time 20 "https://registry.npmjs.org/$enc" | node -e "
                   let raw=''; process.stdin.on('data',(d)=>(raw+=d)); process.stdin.on('end',()=>{
                     try { process.exit(JSON.parse(raw).versions?.['$ver'] ? 0 : 1); }
                     catch { process.exit(1); }
                   });"
              then
                echo "registry visible: $entry (attempt $i)"
                ok=1
                break
              fi
              sleep 10
            done
            if [ "$ok" = "0" ]; then
              echo "$entry not visible after 10min on either channel"
              fail=1
            fi
          done
          exit $fail

      - name: Registry smoke (published artifact shape)
        run: pnpm test:npm-smoke "$(node -p "require('./packages/jdm-editor/package.json').version")"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

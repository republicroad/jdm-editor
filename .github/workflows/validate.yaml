name: Validate

on:
  push:
    branches:
      - master
      - reui
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Validate
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: true

      - name: Lint and prettier
        run: pnpm format

      - name: React Compiler readiness
        run: pnpm lint:compiler

      - name: Style-debt budget (!important / raw-hex caps)
        run: pnpm lint:debt

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Bundle size budget
        run: pnpm size

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Storybook interaction suite (incl. geometry parity guard)
        run: pnpm --filter @gorules/jdm-editor test:storybook

      - name: Consumer smoke (react 18 & 19)
        run: pnpm test:consumer

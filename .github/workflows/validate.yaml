name: Validate

on:
  push:
    branches:
      - master
      - reui
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Validate
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "store-dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.store-dir }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and prettier
        run: pnpm format

      - name: React Compiler readiness
        run: pnpm lint:compiler

      - name: Style-debt budget (!important / raw-hex caps)
        run: pnpm lint:debt

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Bundle size budget
        run: pnpm size

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Storybook interaction suite (incl. geometry parity guard)
        run: pnpm --filter @republicroad/jdm-editor test:storybook

      - name: Consumer smoke (react 18 & 19)
        run: pnpm test:consumer
